# ============================================================
#  Li.Fe. Radio — Import automatico notizie Rockol
#  Workflow GitHub Actions — gira ogni giorno automaticamente
# ============================================================
#
#  COSA FA:
#   Ogni giorno alle 08:00 (ora UTC), questo workflow:
#   1. Risolve la challenge JavaScript di InfinityFree
#   2. Richiama il tuo script import-rockol.php sul server
#   3. Lo script PHP legge Rockol (via scrape.do) e aggiorna content.json
#
#  PREREQUISITI:
#   - import-rockol.php caricato su InfinityFree con la API key scrape.do
#   - Questo file (.github/workflows/import-rockol.yml) + trigger_import.py
#     in un repository GitHub
#
#  COSTO: GRATUITO (GitHub Actions dà 2000 minuti/mese gratis;
#          questo job usa ~1 minuto al giorno = 30 minuti/mese)
# ============================================================

name: Import Rockol News

on:
  schedule:
    # Ogni giorno alle 08:00 UTC (= 10:00 ora italiana in estate, 09:00 in inverno)
    # Cambia l'ora se vuoi un orario diverso (formato cron: minuto ora * * *)
    - cron: "0 8 * * *"
  # Permette di lanciare il job manualmente dal pulsante "Run workflow" su GitHub
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Installa dipendenze Python
        run: pip install pycryptodome

      - name: Esegui import Rockol
        run: python3 trigger_import.py
